<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- CONTENT: seo meta -->
  <title>Transmar | Your Gateway to Regional Trade</title>
  <meta name="description" content="Transmar is your gateway to regional trade: container shipping serving the Red Sea and the Middle East since 1979.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Transmar">
  <meta property="og:title" content="Transmar | Your Gateway to Regional Trade">
  <meta property="og:description" content="Transmar is your gateway to regional trade: container shipping serving the Red Sea and the Middle East since 1979.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Transmar | Your Gateway to Regional Trade">
  <meta name="twitter:description" content="Transmar is your gateway to regional trade: container shipping serving the Red Sea and the Middle East since 1979.">
  <!-- TODO(content): when the domain is known, add these with absolute URLs (example.com = the real domain):
  <link rel="canonical" href="https://example.com/">
  <meta property="og:url" content="https://example.com/">
  <meta property="og:image" content="https://example.com/images/site/og-image.jpg">
  <meta name="twitter:image" content="https://example.com/images/site/og-image.jpg">
  -->
  <!-- /CONTENT -->
  <!-- Set before the stylesheet so the first paint already has the JS layout. If js/script.js
    never marks the page ready (failed to load or threw), `js` is removed at load and the page
    falls back to the no-JS layout with all content visible. -->
  <script>
    document.documentElement.classList.add('js');
    window.addEventListener('load', function () {
      var root = document.documentElement;
      if (!root.hasAttribute('data-js-ready')) root.classList.remove('js');
    });
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/script.js"></script>
</head>
<body>
  <!-- Icon sprite: one <symbol id="icon-…"> per UI icon, drawn with <use href="#icon-…">.
    The symbols are added by issue #7. -->
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"></svg>

  <!-- CONTENT: header skip-link -->
  <a class="skip-link" href="#main">Skip to main content</a>
  <!-- /CONTENT -->

  <!-- ===== SECTION: Header and side menu (issue #9) ===== -->
  <header id="site-header"></header>

  <main id="main" tabindex="-1">
    <!-- The sections, in Figma order, are added by issue #8. -->
  </main>

  <!-- ===== SECTION: Footer (issue #9) ===== -->
  <footer id="site-footer"></footer>
</body>
</html>
